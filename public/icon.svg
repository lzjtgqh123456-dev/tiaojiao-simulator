<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Central Emblem: Stylized Simulator Core & Crystal -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Shield / Hex Ring -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" />
    <!-- Inner Core Diamond -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="url(#accentGrad)" opacity="0.85" />
    <!-- Center Pulse Orb -->
    <circle r="36" fill="#ffffff" />
    <circle r="46" fill="none" stroke="#f43f5e" stroke-width="6" opacity="0.9" />
  </g>
  <!-- Title initial or emblem text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#e2e8f0" text-anchor="middle" letter-spacing="6">TRAINER SIM</text>
</svg>
